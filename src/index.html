<head>

<style>
:root {
	--navy1: #12224d;
	--navy2: #2f5fbf;
	--ink: #1c2330;
	--ink-soft: #4a5568;
	--line: #d9dfe8;
}
.it01 { --accent: hsl(280, 78%, 25%); --accent2: hsl(280, 58%, 55%); --soft: hsl(280, 28%, 95%); }
* { box-sizing: border-box; }
body {
	margin: 0;
	background: #fff;
	color: var(--ink, #1c2330);
	font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
	font-size: 15.5px;
	line-height: 1.85;
}
.titlebar {
	background: linear-gradient(135deg, var(--navy1, #12224d), var(--navy2, #2f5fbf));
	color: #fff;
	padding: 34px 30px 30px;
}
.titlebar .inner { max-width: 1600px; margin: 0 auto; }
.titlebar h1 { margin: 0 0 8px; font-size: 1.9em; color: #fff; }
.titlebar .date { font-size: 0.85em; opacity: 0.85; }
.wrap { max-width: 1600px; margin: 0 auto; padding: 0 30px; }
a.back {
	display: inline-block;
	margin: 20px 0 0;
	padding: 2px 12px;
	border-radius: 6px;
	background: linear-gradient(100deg, var(--navy1, #12224d), var(--navy2, #2f5fbf));
	color: #fff;
	text-decoration: none;
	font-weight: 700;
}
ul.works {
	list-style: none;
	padding: 0;
	margin: 24px 0;
	display: flex;
	flex-wrap: wrap;
	gap: 16px;
}
ul.works a {
	display: block;
	width: 320px;
	max-width: 100%;
	padding: 14px 18px;
	border-left: 6px solid var(--accent, #12224d);
	border-radius: 0 8px 8px 0;
	background: linear-gradient(180deg, var(--soft, #f2f5fb), #fff);
	color: var(--ink, #1c2330);
	text-decoration: none;
	box-shadow: 0 1px 4px rgba(0,0,0,0.12);
}
ul.works .ttl {
	display: block;
	font-size: 1.25em;
	font-weight: 700;
	background: transparent;
	color: var(--accent, #12224d);
}
ul.works .desc {
	display: block;
	font-size: 0.92em;
	background: transparent;
	color: var(--ink-soft, #4a5568);
}
footer {
	max-width: 1600px;
	margin: 0 auto;
	padding: 18px 30px 30px;
	color: var(--ink-soft, #4a5568);
	background: #fff;
}
</style>
</head>
<body>
<div class="titlebar">
	<div class="inner">
		<h1>作品一覧</h1>
		<div class="date">📅 作成: 2026-10-04 / 更新: 2026-10-05</div>
	</div>
</div>
<div class="wrap">
	<a class="back" href="../README.html">⌂</a>

	<p>ブラウザで動く紙芝居。絵をクリックするか、矢印キーで場面を送る。</p>
	<ul class="works">
		<li class="it01"><a href="works/01-momotaro/index.html">
			<span class="ttl">桃太郎</span>
			<span class="desc">桃から生まれ、犬・猿・きじと鬼を退治して、村へ帰るまで。15 場面</span>
		</a></li>
	</ul>
</div>
<footer>
	<a class="back" href="../README.html">⌂</a>
