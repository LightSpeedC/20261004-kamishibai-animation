<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>サンプル: Web Speech API の読み上げ</title>
<style>
:root {
	--navy1: #12224d;
	--navy2: #2f5fbf;
	--ink: #1c2330;
	--ink-soft: #4a5568;
	--line: #d9dfe8;
	--code-bg: #f4f6fa;
	--accent: #12224d;
	--accent2: #2f5fbf;
	--soft: #f2f5fb;
}
* { box-sizing: border-box; }
body {
	margin: 0;
	background: #fff;
	color: var(--ink, #1c2330);
	font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
	font-size: 15.5px;
	line-height: 1.85;
}
.titlebar {
	background: linear-gradient(135deg, var(--navy1, #12224d), var(--navy2, #2f5fbf));
	color: #fff;
	padding: 34px 30px 30px;
}
.titlebar .inner { max-width: 1600px; margin: 0 auto; }
.titlebar h1 { margin: 0 0 8px; font-size: 1.9em; color: #fff; }
.titlebar .date { font-size: 0.85em; opacity: 0.85; }
.wrap { max-width: 1600px; margin: 0 auto; padding: 0 30px; }
a.back {
	display: inline-block;
	margin: 20px 0 0;
	padding: 2px 12px;
	border-radius: 6px;
	background: linear-gradient(100deg, var(--navy1, #12224d), var(--navy2, #2f5fbf));
	color: #fff;
	text-decoration: none;
	font-weight: 700;
}
h2 {
	border-left: 6px solid var(--accent, #12224d);
	background: linear-gradient(90deg, var(--soft, #f2f5fb), #fff);
	color: var(--ink, #1c2330);
	padding: 6px 12px;
	margin: 30px 0 12px;
	font-size: 1.2em;
}
textarea, select {
	font: inherit;
	width: 100%;
	max-width: 900px;
	padding: 8px 10px;
	border: 1px solid var(--line, #d9dfe8);
	border-radius: 6px;
	background: #fff;
	color: var(--ink, #1c2330);
}
textarea { height: 7em; }
.form { display: grid; grid-template-columns: max-content 1fr; gap: 10px 16px; align-items: center; max-width: 1060px; }
.form label { font-weight: 700; }
.form .range { display: flex; align-items: center; gap: 10px; }
.form .range input { flex: 1; max-width: 400px; }
.form .range output { min-width: 3em; font-variant-numeric: tabular-nums; }
.check { font-weight: normal; }
.buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
button {
	font: inherit;
	font-weight: 700;
	padding: 8px 20px;
	border: none;
	border-radius: 6px;
	background: linear-gradient(100deg, var(--accent, #12224d), var(--accent2, #2f5fbf));
	color: #fff;
	cursor: pointer;
	box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
button:active { transform: translateY(1px); }
#status { color: var(--ink-soft, #4a5568); background: transparent; }
.tablewrap { overflow-x: auto; }
table {
	border-collapse: collapse;
	width: 100%;
	border-radius: 8px;
	overflow: hidden;
	box-shadow: 0 1px 4px rgba(0,0,0,0.08);
	font-size: 0.95em;
}
th, td {
	padding: 9px 12px;
	border-bottom: 1px solid var(--line, #d9dfe8);
	text-align: left;
	vertical-align: top;
}
th {
	background: linear-gradient(100deg, var(--accent, #12224d), var(--accent2, #2f5fbf));
	color: #fff;
}
td { background: #fff; color: var(--ink, #1c2330); }
tr:nth-child(even) td { background: #fafbfe; color: var(--ink, #1c2330); }
td.nowrap { white-space: nowrap; }
.badge {
	display: inline-block;
	padding: 0 8px;
	border-radius: 4px;
	color: #fff;
	font-size: 0.85em;
	font-weight: 700;
	white-space: nowrap;
}
.b-ok { background: linear-gradient(100deg, #1d7a3c, #45b56c); color: #fff; }
.b-warn { background: linear-gradient(100deg, #b8620a, #f0a548); color: #fff; }
footer {
	max-width: 1600px;
	margin: 0 auto;
	padding: 18px 30px 30px;
	color: var(--ink-soft, #4a5568);
	background: #fff;
}
</style>
</head>
<body>
<div class="titlebar">
	<div class="inner">
		<h1>サンプル: Web Speech API の読み上げ</h1>
		<div class="date">📅 作成: 2026-10-04 / 更新: 2026-10-05</div>
	</div>
</div>
<div class="wrap">
	<a class="back" href="../../README.html">⌂</a>

	<p>ブラウザ標準の Web Speech API（<code>speechSynthesis</code>）で読み上げる。文章・声・速さ・高さ・音量を変えて試せる。</p>

	<h2>読み上げ</h2>
	<div class="form">
		<label for="text">文章</label>
		<textarea id="text">むかしむかし、ある山のふもとに、小さな村がありました。</textarea>

		<label for="voice">声</label>
		<select id="voice"></select>

		<span></span>
		<label class="check"><input type="checkbox" id="local-only" checked> 内蔵の声だけを出す</label>

		<span></span>
		<label class="check"><input type="checkbox" id="ja-only" checked> 日本語の声だけを出す</label>

		<label for="rate">速さ</label>
		<div class="range"><input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"><output id="rate-out">1.0</output></div>

		<label for="pitch">高さ</label>
		<div class="range"><input type="range" id="pitch" min="0" max="2" step="0.1" value="1"><output id="pitch-out">1.0</output></div>

		<label for="volume">音量</label>
		<div class="range"><input type="range" id="volume" min="0" max="1" step="0.1" value="1"><output id="volume-out">1.0</output></div>
	</div>
	<div class="buttons">
		<button id="btn-speak">読み上げ</button>
		<button id="btn-stop">停止</button>
	</div>
	<p id="status"></p>

	<h2>このブラウザで使える声</h2>
	<p>「内蔵」は <code>localService</code> が <code>true</code> の声で、PC・スマホの中で動き、ネットに繋がずに読める。「ネット」はブラウザの提供元のサービスへ文章を送って読み上げる。</p>
	<div class="tablewrap">
	<table>
		<thead>
			<tr><th>名前</th><th>言語</th><th>動く場所</th><th>既定</th></tr>
		</thead>
		<tbody id="voice-table"></tbody>
	</table>
	</div>
</div>
<footer>
	<a class="back" href="../../README.html">⌂</a>
</footer>

<script>
const $ = (id) => document.getElementById(id);
let voices = [];

// 声の一覧は後から届くことがある（Chrome は voiceschanged を待つ必要がある）
function loadVoices() {
	voices = speechSynthesis.getVoices();
	renderTable();
	renderSelect();
}

function renderTable() {
	const rows = voices.map((v) => {
		const where = v.localService
			? '<span class="badge b-ok">内蔵</span>'
			: '<span class="badge b-warn">ネット</span>';
		return '<tr><td>' + escapeHtml(v.name) + '</td><td class="nowrap">' + escapeHtml(v.lang)
			+ '</td><td class="nowrap">' + where + '</td><td class="nowrap">' + (v.default ? '既定' : '') + '</td></tr>';
	});
	$('voice-table').innerHTML = rows.length ? rows.join('') : '<tr><td colspan="4">声が見つからない</td></tr>';
}

function renderSelect() {
	const prev = $('voice').value;
	const localOnly = $('local-only').checked;
	const jaOnly = $('ja-only').checked;
	const list = voices.filter((v) => (!localOnly || v.localService) && (!jaOnly || v.lang.startsWith('ja')));
	$('voice').innerHTML = list.map((v) => {
		const label = v.name + '（' + v.lang + ' / ' + (v.localService ? '内蔵' : 'ネット') + '）';
		return '<option value="' + escapeHtml(v.name) + '">' + escapeHtml(label) + '</option>';
	}).join('');
	if (list.some((v) => v.name === prev)) $('voice').value = prev;
}

function escapeHtml(s) {
	return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function speak() {
	speechSynthesis.cancel();
	const u = new SpeechSynthesisUtterance($('text').value);
	const voice = voices.find((v) => v.name === $('voice').value);
	if (voice) {
		u.voice = voice;
		u.lang = voice.lang;
	} else {
		u.lang = 'ja-JP';
	}
	u.rate = Number($('rate').value);
	u.pitch = Number($('pitch').value);
	u.volume = Number($('volume').value);
	u.onstart = () => { $('status').textContent = '読み上げ中: ' + (voice ? voice.name : '既定の声'); };
	u.onend = () => { $('status').textContent = '読み終わり'; };
	u.onerror = (e) => { $('status').textContent = 'エラー: ' + e.error; };
	speechSynthesis.speak(u);
}

for (const id of ['rate', 'pitch', 'volume']) {
	$(id).addEventListener('input', () => { $(id + '-out').textContent = Number($(id).value).toFixed(1); });
}
$('local-only').addEventListener('change', renderSelect);
$('ja-only').addEventListener('change', renderSelect);
$('btn-speak').addEventListener('click', speak);
$('btn-stop').addEventListener('click', () => { speechSynthesis.cancel(); $('status').textContent = '停止'; });

if ('speechSynthesis' in window) {
	speechSynthesis.addEventListener('voiceschanged', loadVoices);
	loadVoices();
} else {
	$('status').textContent = 'このブラウザは Web Speech API に対応していない';
}
</script>
</body>
</html>
